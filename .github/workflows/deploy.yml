name: Docker Build -> push -> deploy

on:
  push:
    branches: [ "main" ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: |
          chmod +x mvnw 
          ./mvnw clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/s3-service-demo:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/s3-service-demo:latest

      - name: SSH and Deploy to Application EC2
        uses: appleboy/ssh-action@v1
        env:
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
          RDS_DATABASE: ${{ secrets.RDS_DATABASE }}
          RDS_USERNAME: ${{ secrets.RDS_USERNAME }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: RDS_ENDPOINT,RDS_DATABASE,RDS_USERNAME,RDS_PASSWORD,DOCKERHUB_USERNAME
          script: |
            echo "===== Docker Version ====="
            docker --version
            
            echo "===== Docker pull image ====="
            docker pull ${DOCKERHUB_USERNAME}/s3-service-demo:latest
            
            echo "===== Removing old container if exists ====="
            docker rm -f s3-service-demo || true
            
            echo "===== Starting new container ====="
            docker run -d \
              --name s3-service-demo \
              -p 5555:5555 \
              -e RDS_ENDPOINT="${RDS_ENDPOINT}" \
              -e RDS_DATABASE="${RDS_DATABASE}" \
              -e RDS_USERNAME="${RDS_USERNAME}" \
              -e RDS_PASSWORD="${RDS_PASSWORD}" \
              ${DOCKERHUB_USERNAME}/s3-service-demo:latest
            
            echo "===== Container status ====="
            docker ps
            
            echo "===== Deployment completed ====="